name: CI

on:
  push:
    branches: [main]
  pull_request:

# Репозиторий публичный, и заданию здесь нечего писать: оно только собирает
# и проверяет. Права по умолчанию шире, чем нужно.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты пакетов
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Версия Swift
        run: swift --version

      # Предупреждения в этом проекте — ошибки: строгая конкурентность Swift 6
      # ловит здесь ровно те гонки, которые в звуке проявляются раз в сто
      # запусков и не воспроизводятся. Тесты собираются тем же гейтом: три
      # нарушения изоляции прятались именно в них, а тест, читающий не оттуда,
      # куда пишет, проходит зелёным и не проверяет ничего.
      - name: DictationCore
        run: |
          swift build --package-path Packages/DictationCore --build-tests -Xswiftc -warnings-as-errors
          swift test --package-path Packages/DictationCore

      - name: LocalASR
        run: |
          swift build --package-path Packages/LocalASR --build-tests -Xswiftc -warnings-as-errors
          swift test --package-path Packages/LocalASR

  app:
    name: Сборка приложения
    runs-on: macos-26
    # Цель приложения живёт в строке меню и на первом запуске открывает окно.
    # Тесты собраны без хозяина именно поэтому, но если однажды хозяин
    # вернётся, прогон повиснет до конца лимита GitHub, а не упадёт.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Проект собирается из project.yml и в репозитории не лежит.
      - name: Проверить pinned XcodeGen
        run: ./scripts/pinned-xcodegen.sh >/dev/null

      # Половина дефектов первого дня жила именно в цели приложения — в
      # пакетах их не видно, потому что она в них не входит. Гоняем тесты, а не
      # только сборку: одиннадцать дефектов там нашлись именно тестами, а не
      # компилятором.
      - name: Собрать и прогнать тесты
        run: |
          cd apps/macos
          XCODEGEN=$(../../scripts/pinned-xcodegen.sh)
          "$XCODEGEN" generate
          xcodebuild -project WaiDictation.xcodeproj -scheme WaiDictation \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO test

  network-surface:
    name: Сетевая поверхность
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Главное обещание продукта проверяется автоматически, а не на слово.
      - name: Проверить, что сеть только там, где разрешено
        run: ./scripts/check-network-surface.sh

  arm64-build:
    name: Apple Silicon only
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Safe beta поддерживает только Apple Silicon.
      - name: LocalASR arm64
        run: swift build --package-path Packages/LocalASR --arch arm64

  release-build:
    name: Релизная сборка
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Проверить pinned XcodeGen
        run: ./scripts/pinned-xcodegen.sh >/dev/null

      - name: Проверить bootstrap и notary credentials
        run: |
          ./scripts/tests/test-notary-credentials.sh
          ./scripts/tests/test-bootstrap-release-secrets.sh

      # Всё остальное в CI собирает Debug под текущее назначение. Релиз идёт
      # другой дорогой: конфигурация Release, архив, `generic/platform=macOS`
      # и arm64-only artifact. Поломка, которая живёт только на этой дороге,
      # раньше обнаруживалась в момент выпуска — то есть тогда, когда чинить
      # её некогда. Подписи здесь нет и не нужно: проверяем сборку, а не
      # сертификат.
      - name: Собрать образ без подписи
        run: ./scripts/build-dmg.sh

      # Значения, от которых зависит судьба уже установленных копий. Каждое
      # из них ломает разное: идентификатор — выданный универсальный доступ,
      # SUFeedURL — доставку обновлений, три ключа Sparkle — обещание «сеть
      # только по вашей команде», расхождение версий — имя образа и то, что
      # видит человек в окне обновления.
      - name: Проверить инварианты Info.plist
        run: |
          PLIST="artifacts/build/WaiDictation.xcarchive/Products/Applications/Wai Dictation Dev.app/Contents/Info.plist"
          p() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" 2>/dev/null; }
          bad=0
          expect() {
            local actual; actual=$(p "$1")
            if [[ "$actual" == "$2" ]]; then
              printf '  %-28s %s\n' "$1" "$actual"
            else
              printf '  %-28s ожидалось «%s», получилось «%s»\n' "$1" "$2" "$actual"
              bad=1
            fi
          }
          expect CFBundleIdentifier is.waiwai.dictation.dev
          expect LSMinimumSystemVersion 14.0
          expect LSUIElement true
          expect SUEnableAutomaticChecks false
          expect SUSendProfileInfo false
          expect SUAllowsAutomaticUpdates false

          feed=$(p SUFeedURL)
          printf '  %-28s %s\n' SUFeedURL "${feed:-(пусто)}"
          [[ -n "$feed" ]] || bad=1

          marketing=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' apps/macos/project.yml | head -1)
          short=$(p CFBundleShortVersionString)
          printf '  %-28s project.yml=%s Info.plist=%s\n' версия "$marketing" "$short"
          [[ "$marketing" == "$short" ]] || bad=1

          current=$(sed -n 's/^ *CURRENT_PROJECT_VERSION: *"\{0,1\}\([0-9]*\)"\{0,1\} *$/\1/p' apps/macos/project.yml | head -1)
          build=$(p CFBundleVersion)
          printf '  %-28s project.yml=%s Info.plist=%s\n' сборка "$current" "$build"
          [[ "$current" == "$build" ]] || bad=1

          exit $bad

      - name: Проверить обязательные notices модели и зависимостей
        run: |
          RESOURCES="artifacts/build/WaiDictation.xcarchive/Products/Applications/Wai Dictation Dev.app/Contents/Resources"
          for file in \
            LICENSE NOTICE THIRD_PARTY_LICENSES.md \
            model-manifest.json vocabulary-manifest.json \
            FluidAudio-Apache-2.0.txt FluidAudio-fastcluster-BSD.txt \
            FluidAudio-vbx-Apache-2.0.txt Sparkle-LICENSE.txt \
            Parakeet-CC-BY-4.0.txt
          do
            test -s "$RESOURCES/$file" || { echo "Нет обязательного resource: $file" >&2; exit 1; }
          done

      # Образ, который не монтируется, — это провал ровно на том шаге, который
      # делает каждый пользователь и не делает ни один тест.
      - name: Проверить, что образ открывается
        run: |
          DMG=$(ls artifacts/dmg/WaiDictationDev-*.dmg)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint /tmp/waidmg
          test -d "/tmp/waidmg/Wai Dictation Dev.app"
          test -L "/tmp/waidmg/Applications"
          hdiutil detach /tmp/waidmg

  feed:
    name: Лента обновлений
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # docs/appcast.xml — единственный файл, который приложение скачивает
      # само. Сломанный XML тут означает, что обновления не приедут никому и
      # узнается об этом не от CI, а от людей.
      - name: Лента разбирается как XML
        run: xmllint --noout docs/appcast.xml

      # scripts/update-appcast.py — единственный код, который эту ленту пишет,
      # и до сих пор в CI не исполнялась ни одна его строка. Проверяем три
      # свойства, на которых держится доставка: запись появляется, номер
      # сборки не может уменьшиться, повторный выпуск той же сборки не плодит
      # дубль.
      - name: update-appcast.py делает то, что обещает
        run: |
          T=$(mktemp -d)
          cp docs/appcast.xml "$T/feed.xml"
          printf -- '- Проверка.\n' > "$T/notes.md"
          common=(APPCAST="$T/feed.xml" NOTES_PATH="$T/notes.md" MIN_OS=14.0
                  FEED_URL=https://example.invalid/appcast.xml
                  DMG_URL=https://example.invalid/a.dmg
                  LENGTH=1 SIGNATURE=подпись APP_NAME="Wai Dictation")

          env "${common[@]}" VERSION=9.9.9 BUILD=999 python3 scripts/update-appcast.py
          xmllint --noout "$T/feed.xml"
          grep -q '<title>9.9.9</title>' "$T/feed.xml"

          if env "${common[@]}" VERSION=9.9.8 BUILD=998 python3 scripts/update-appcast.py; then
            echo "ПРОВАЛ: лента приняла сборку с меньшим номером" >&2
            exit 1
          fi

          env "${common[@]}" VERSION=9.9.9 BUILD=999 python3 scripts/update-appcast.py
          count=$(grep -c '<title>9.9.9</title>' "$T/feed.xml")
          if [[ "$count" != "1" ]]; then
            echo "ПРОВАЛ: повторный выпуск сборки 999 оставил $count записей" >&2
            exit 1
          fi
          echo "Лента ведёт себя как договорились."
